<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>漢字クラフト V1</title>
<style>
  :root { --bg:#f5f1e8; --ink:#222; --card:#fffdf8; --accent:#4b7bec; --ok:#1f9d55; --bad:#d64545; --muted:#777; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; background:linear-gradient(#dff4ff,#f5f1e8 45%); color:var(--ink); min-height:100vh; }
  .app { max-width:760px; margin:auto; padding:16px; }
  h1,h2,h3,p { margin-top:0; }
  .card { background:var(--card); border-radius:18px; padding:18px; box-shadow:0 8px 24px rgba(0,0,0,.08); margin:12px 0; }
  .hero { text-align:center; padding:24px 18px; }
  .hero h1 { font-size:32px; margin-bottom:8px; }
  .sub { color:var(--muted); font-size:14px; }
  .grade-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { border:0; border-radius:14px; padding:14px 16px; font-size:17px; font-weight:700; background:#e8edf7; color:#222; }
  button.primary { background:var(--accent); color:white; }
  button.good { background:var(--ok); color:white; }
  button.warn { background:#ef8d22; color:white; }
  button.danger { background:var(--bad); color:white; }
  button:disabled { opacity:.45; }
  .hidden { display:none !important; }
  .topbar { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .badge { background:#eef3ff; padding:7px 10px; border-radius:999px; font-size:13px; font-weight:700; }
  .prompt { text-align:center; font-size:34px; font-weight:800; letter-spacing:.08em; margin:12px 0; }
  .meaning { text-align:center; font-size:15px; color:var(--muted); min-height:22px; }
  .canvas-wrap { display:grid; gap:12px; margin:16px 0; }
  .kanji-cell { position:relative; aspect-ratio:1; background:white; border:3px solid #333; border-radius:12px; overflow:hidden; }
  .kanji-cell::before,.kanji-cell::after { content:""; position:absolute; background:#ddd; z-index:0; }
  .kanji-cell::before { left:50%; top:0; width:1px; height:100%; }
  .kanji-cell::after { top:50%; left:0; width:100%; height:1px; }
  canvas { position:relative; z-index:1; width:100%; height:100%; touch-action:none; display:block; }
  .ghost { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:min(30vw,160px); color:rgba(30,30,30,.12); z-index:0; font-weight:700; pointer-events:none; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .feedback { text-align:center; min-height:52px; font-size:18px; font-weight:800; padding:8px; }
  .progress { height:14px; background:#e6e6e6; border-radius:999px; overflow:hidden; }
  .progress > div { height:100%; width:0%; background:var(--accent); transition:.3s; }
  .road { display:flex; gap:4px; margin-top:10px; }
  .road span { flex:1; height:12px; background:#ddd; border-radius:8px; }
  .road span.done { background:#59a14f; }
  .inventory { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; }
  .inv { padding:10px 6px; border-radius:12px; background:#f1f4f7; font-size:13px; }
  .inv b { display:block; font-size:21px; }
  .build { min-height:180px; display:flex; align-items:end; justify-content:center; gap:6px; flex-wrap:wrap; padding:14px; background:linear-gradient(#ccecff 60%,#98c66d 60%); border-radius:16px; overflow:hidden; }
  .block { width:34px; height:34px; border:2px solid rgba(0,0,0,.2); border-radius:4px; display:inline-block; }
  .wood { background:#b9844a; } .stone{background:#989898;} .iron{background:#c9d1d9;} .gem{background:#76d7c4;}
  .small { font-size:13px; color:var(--muted); }
  .section-title { font-size:19px; margin-bottom:10px; }
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:#f3f5f7; padding:12px; border-radius:12px; text-align:center; }
  .stat b { font-size:24px; display:block; }
  .footer-note { font-size:12px; color:#666; line-height:1.5; }
  @media (min-width:540px){ .canvas-wrap{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div class="app">
  <section id="home" class="card hero">
    <h1>🧱 漢字クラフト</h1>
    <p>ひらがなを見て、指で漢字を書いて進もう。</p>
    <p class="sub">正解すると素材ゲット。10問クリアでゴール！</p>
    <div class="grade-grid">
      <button class="primary" onclick="startGame(4)">小学4年生</button>
      <button class="primary" onclick="startGame(6)">小学6年生</button>
    </div>
    <div style="height:10px"></div>
    <button onclick="showStats()">成績を見る</button>
  </section>

  <section id="game" class="hidden">
    <div class="card">
      <div class="topbar">
        <span id="gradeBadge" class="badge"></span>
        <span id="questionCount" class="badge"></span>
        <span id="comboBadge" class="badge">コンボ 0</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="road" id="road"></div>
    </div>

    <div class="card">
      <div class="small" style="text-align:center">ひらがなを漢字にしよう</div>
      <div id="prompt" class="prompt"></div>
      <div id="meaning" class="meaning"></div>
      <div id="canvasWrap" class="canvas-wrap"></div>
      <div class="controls">
        <button onclick="clearCanvases()">書き直す</button>
        <button class="warn" onclick="useHint()">ヒント</button>
        <button class="good" id="judgeBtn" onclick="judgeAnswer()">判定する</button>
        <button class="primary hidden" id="nextBtn" onclick="nextQuestion()">次へ</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>

    <div class="card">
      <h3 class="section-title">🎒 素材</h3>
      <div class="inventory">
        <div class="inv">木<b id="wood">0</b></div>
        <div class="inv">石<b id="stone">0</b></div>
        <div class="inv">鉄<b id="iron">0</b></div>
        <div class="inv">宝石<b id="gem">0</b></div>
      </div>
      <h3 class="section-title" style="margin-top:16px">🏠 今日の建築</h3>
      <div class="build" id="buildArea"></div>
    </div>
  </section>

  <section id="result" class="card hidden hero">
    <h2>🏁 ゴール！</h2>
    <div id="resultText"></div>
    <div style="height:12px"></div>
    <button class="primary" onclick="backHome()">トップへ戻る</button>
  </section>

  <section id="stats" class="card hidden">
    <h2>📊 成績</h2>
    <div id="statsContent"></div>
    <button onclick="backHome()">戻る</button>
  </section>

  <section class="card">
    <div class="footer-note">
      V1は「書いた文字の形を完全OCR判定」ではなく、書き込み量・マスごとの入力・ヒント使用量を使った簡易判定です。まずはゲームの流れと継続性を確認する試作版です。
    </div>
  </section>
</div>

<script>
const BANK = {
  4: [
    {kana:'きぼう', answer:'希望', meaning:'かなえたいと思うこと'},
    {kana:'こうえん', answer:'公園', meaning:'みんなが遊べる場所'},
    {kana:'やくそく', answer:'約束', meaning:'守ると決めたこと'},
    {kana:'けっか', answer:'結果', meaning:'最後にどうなったか'},
    {kana:'れきし', answer:'歴史', meaning:'昔から今までの出来事'},
    {kana:'せいこう', answer:'成功', meaning:'うまくやりとげること'},
    {kana:'ひつよう', answer:'必要', meaning:'なくてはならないこと'},
    {kana:'きせつ', answer:'季節', meaning:'春・夏・秋・冬'},
    {kana:'けしき', answer:'景色', meaning:'目に見えるながめ'},
    {kana:'えいよう', answer:'栄養', meaning:'体をつくるもと'}
  ],
  6: [
    {kana:'けいけん', answer:'経験', meaning:'実際にやって身につけたこと'},
    {kana:'かんきょう', answer:'環境', meaning:'まわりのようすや条件'},
    {kana:'せきにん', answer:'責任', meaning:'引き受けたことを果たすこと'},
    {kana:'こんなん', answer:'困難', meaning:'とてもむずかしいこと'},
    {kana:'しせい', answer:'姿勢', meaning:'体や気持ちのかまえ'},
    {kana:'しょうらい', answer:'将来', meaning:'これから先の未来'},
    {kana:'ちいき', answer:'地域', meaning:'あるまとまりの土地'},
    {kana:'けんり', answer:'権利', meaning:'してよいと認められたこと'},
    {kana:'せんもん', answer:'専門', meaning:'くわしく学んでいる分野'},
    {kana:'しりょう', answer:'資料', meaning:'考えたり調べたりするための材料'}
  ]
};

let state = { grade:4, q:0, score:0, combo:0, bestCombo:0, wrong:[], hints:0, inventory:{wood:0,stone:0,iron:0,gem:0}, current:null, canvases:[], drawingMeta:[] };

function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }
function startGame(grade){
  state = { grade, q:0, score:0, combo:0, bestCombo:0, wrong:[], hints:0, inventory:{wood:0,stone:0,iron:0,gem:0}, current:null, canvases:[], drawingMeta:[], deck:shuffle(BANK[grade]).slice(0,10) };
  document.getElementById('home').classList.add('hidden');
  document.getElementById('stats').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('gradeBadge').textContent = `小学${grade}年生`;
  setupRoad();
  nextQuestion(true);
}
function setupRoad(){
  const road=document.getElementById('road'); road.innerHTML='';
  for(let i=0;i<10;i++){ const s=document.createElement('span'); road.appendChild(s); }
}
function updateRoad(){ [...document.getElementById('road').children].forEach((e,i)=>e.classList.toggle('done',i<state.q)); }
function nextQuestion(first=false){
  if(!first) state.q++;
  if(state.q>=10) return finishGame();
  state.current=state.deck[state.q];
  document.getElementById('questionCount').textContent=`${state.q+1} / 10`;
  document.getElementById('progressBar').style.width=`${state.q*10}%`;
  document.getElementById('comboBadge').textContent=`コンボ ${state.combo}`;
  document.getElementById('prompt').textContent=state.current.kana;
  document.getElementById('meaning').textContent=state.current.meaning;
  document.getElementById('feedback').textContent='';
  document.getElementById('judgeBtn').classList.remove('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  renderCanvases();
  updateInventory(); updateBuild(); updateRoad();
}
function renderCanvases(){
  const wrap=document.getElementById('canvasWrap'); wrap.innerHTML=''; state.canvases=[]; state.drawingMeta=[];
  [...state.current.answer].forEach((char,idx)=>{
    const cell=document.createElement('div'); cell.className='kanji-cell';
    const ghost=document.createElement('div'); ghost.className='ghost'; ghost.textContent=''; ghost.dataset.char=char;
    const canvas=document.createElement('canvas');
    cell.appendChild(ghost); cell.appendChild(canvas); wrap.appendChild(cell);
    setupCanvas(canvas, idx);
    state.canvases.push(canvas); state.drawingMeta.push({points:0,strokes:0,ink:0});
  });
}
function setupCanvas(canvas, idx){
  const resize=()=>{ const r=canvas.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,2); canvas.width=r.width*dpr; canvas.height=r.height*dpr; const c=canvas.getContext('2d'); c.scale(dpr,dpr); c.lineCap='round'; c.lineJoin='round'; c.lineWidth=8; c.strokeStyle='#111'; };
  requestAnimationFrame(resize);
  let drawing=false,last=null;
  const pos=e=>{ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ e.preventDefault(); drawing=true; last=pos(e); state.drawingMeta[idx].strokes++; };
  const move=e=>{ if(!drawing)return; e.preventDefault(); const p=pos(e),c=canvas.getContext('2d'); c.beginPath(); c.moveTo(last.x,last.y); c.lineTo(p.x,p.y); c.stroke(); const dx=p.x-last.x,dy=p.y-last.y; state.drawingMeta[idx].ink+=Math.hypot(dx,dy); state.drawingMeta[idx].points++; last=p; };
  const end=e=>{ if(drawing){ e&&e.preventDefault(); drawing=false; } };
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end,{passive:false});
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
}
function clearCanvases(){ renderCanvases(); document.getElementById('feedback').textContent=''; }
function useHint(){
  state.hints++;
  const ghosts=[...document.querySelectorAll('.ghost')];
  const level=Math.min(2,state.hints);
  ghosts.forEach((g,i)=>{
    if(level===1 && i===0) g.textContent=g.dataset.char;
    else if(level>=2) g.textContent=g.dataset.char;
  });
  document.getElementById('feedback').textContent = level===1 ? 'ヒント：最初の漢字だけ薄く表示！' : 'ヒント：全部うすく表示。なぞって覚えよう！';
}
function judgeAnswer(){
  const enough=state.drawingMeta.every(m=>m.points>=6 && m.strokes>=1 && m.ink>=35);
  const veryGood=state.drawingMeta.every(m=>m.points>=15 && m.ink>=90);
  let correct = enough && (veryGood || state.hints>0 || Math.random()>.18);
  if(correct){
    state.score++; state.combo++; state.bestCombo=Math.max(state.bestCombo,state.combo);
    const reward = state.combo>=5 ? 'gem' : state.combo>=3 ? 'iron' : (state.q%2===0?'wood':'stone');
    state.inventory[reward]++;
    const names={wood:'木',stone:'石',iron:'鉄',gem:'宝石'};
    document.getElementById('feedback').innerHTML=`✅ クリア！ <span style="color:#1f9d55">${names[reward]}を1個ゲット</span>`;
  } else {
    state.combo=0; state.wrong.push(state.current.answer);
    document.getElementById('feedback').innerHTML=`❌ もう一度！ 正解は <b>${state.current.answer}</b><br><span class="small">形を見てから、書き直してみよう。</span>`;
    [...document.querySelectorAll('.ghost')].forEach(g=>g.textContent=g.dataset.char);
  }
  document.getElementById('comboBadge').textContent=`コンボ ${state.combo}`;
  document.getElementById('judgeBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  updateInventory(); updateBuild();
}
function updateInventory(){ ['wood','stone','iron','gem'].forEach(k=>document.getElementById(k).textContent=state.inventory[k]); }
function updateBuild(){
  const a=document.getElementById('buildArea'); a.innerHTML='';
  const order=['wood','stone','iron','gem'];
  order.forEach(k=>{ for(let i=0;i<state.inventory[k];i++){ const b=document.createElement('span'); b.className=`block ${k}`; a.appendChild(b); } });
  if(a.children.length===0) a.innerHTML='<span class="small">正解するとここに建物の材料が増えるよ</span>';
}
function finishGame(){
  document.getElementById('game').classList.add('hidden'); document.getElementById('result').classList.remove('hidden');
  document.getElementById('progressBar').style.width='100%';
  const mastered=10-state.wrong.length;
  document.getElementById('resultText').innerHTML=`<p style="font-size:24px;font-weight:800">${state.score} / 10 正解</p><p>最高コンボ：${state.bestCombo}</p><p>苦手候補：${[...new Set(state.wrong)].join('・') || 'なし！'}</p>`;
  saveStats(mastered);
}
function saveStats(mastered){
  const key=`kanjiCraftStats${state.grade}`;
  const old=JSON.parse(localStorage.getItem(key)||'{"plays":0,"total":0,"best":0,"wrong":{}}');
  old.plays++; old.total+=state.score; old.best=Math.max(old.best,state.bestCombo);
  state.wrong.forEach(k=>old.wrong[k]=(old.wrong[k]||0)+1);
  localStorage.setItem(key,JSON.stringify(old));
}
function showStats(){
  document.getElementById('home').classList.add('hidden'); document.getElementById('stats').classList.remove('hidden');
  let html='';
  [4,6].forEach(g=>{
    const s=JSON.parse(localStorage.getItem(`kanjiCraftStats${g}`)||'{"plays":0,"total":0,"best":0,"wrong":{}}');
    const avg=s.plays?Math.round(s.total/s.plays*10)/10:0;
    const wrong=Object.entries(s.wrong).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`${k}(${v})`).join('・')||'まだなし';
    html+=`<div class="card"><h3>小学${g}年生</h3><div class="stats-grid"><div class="stat">プレイ回数<b>${s.plays}</b></div><div class="stat">平均正解<b>${avg}/10</b></div><div class="stat">最高コンボ<b>${s.best}</b></div><div class="stat">苦手TOP<b style="font-size:14px">${wrong}</b></div></div></div>`;
  });
  document.getElementById('statsContent').innerHTML=html;
}
function backHome(){
  document.getElementById('game').classList.add('hidden'); document.getElementById('result').classList.add('hidden'); document.getElementById('stats').classList.add('hidden'); document.getElementById('home').classList.remove('hidden');
}
</script>
</body>
</html>
